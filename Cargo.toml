[package]
name = "aeon-engine"
version = "0.1.2022741"
edition = "2024"
authors = ["IntelliBitz", "Muthu Ramadoss", "AEON EAI Core"]
description = "aeon-engine: EAI: Exponential Intelligence for Any AI. - GAWD, GEMI & GMCP Multi-Agent Engine"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
candle-core = { version = "0.8.2" }
candle-nn = { version = "0.8.2" }
candle-transformers = { version = "0.8.2" }
tokenizers = "0.21.0"
hf-hub = "0.4.1"
anyhow = "1.0"
ureq = { version = "2.12", features = ["json", "tls"] }
rustyline = "15.0"
wasmer = { version = "3.1", features = ["cranelift", "sys"] }
wasmer-wasi = "3.1"
base64 = "0.22"
once_cell = "1.19"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]

[profile.release]
opt-level = 3 # High performance
lto = "thin" # Faster parallel LTO
codegen-units = 256 # Saturate all 28 cores
incremental = true # Speed up iterative builds
panic = "abort"
strip = true
