[package]
name = "aeon"
version = "0.1.2022777"
edition = "2021"
authors = ["IntelliBitz", "Muthu Ramadoss", "AEON EAI Core"]
description = "AEON Master Agent (AMA) Lightweight Native CLI Binary Launcher"
license = "Apache-2.0"

[dependencies]

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Single codegen unit for max optimization
panic = "abort"     # Remove panic unwinding code
strip = true        # Automatically strip symbols
